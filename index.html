<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-kmp.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMP | Krisna Mandiri Perkasa — Mitra Presisi Komponen Otomasi & Suku Cadang Industri</title>
    <meta name="description" content="Portal resmi CV. Krisna Mandiri Perkasa (KMP) - Solusi pengadaan suku cadang industri, pneumatik pabrik, solenoid valve, dan silinder aktuator terpercaya." />
    
    <!-- Fonts: Plus Jakarta Sans & Poppins for Fresh Modern Editorial Tech Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS with custom theme inspired by modern Chevron tech design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Poppins', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
            },
            colors: {
              brand: {
                50: '#FFF7ED',
                100: '#FFEDD5',
                200: '#FED7AA',
                300: '#FDBA74',
                400: '#FB923C',
                500: '#EA580C',
                600: '#C2410C',
                700: '#9A3412',
                amber: '#DF9235',
                amberHover: '#C97E25',
              },
              dark: {
                950: '#090D16',
                900: '#0F172A',
                800: '#1E293B',
                700: '#334155',
              },
              surface: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E2E8F0',
                300: '#CBD5E1',
              }
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
              'card': '0 12px 35px -8px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03)',
              'card-hover': '0 20px 45px -10px rgba(15, 23, 42, 0.12), 0 8px 16px -4px rgba(15, 23, 42, 0.04)',
              'glow-amber': '0 10px 30px -5px rgba(223, 146, 53, 0.35)',
              'glow-subtle': '0 0 35px -5px rgba(223, 146, 53, 0.15)',
              'floating': '0 25px 50px -12px rgba(15, 23, 42, 0.25)',
            },
            animation: {
              'marquee': 'marquee 28s linear infinite',
              'marquee-reverse': 'marquee-reverse 28s linear infinite',
              'float': 'float 5s ease-in-out infinite',
              'pulse-subtle': 'pulseSubtle 3s ease-in-out infinite',
              'shimmer': 'shimmer 2.5s infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'marquee-reverse': {
                '0%': { transform: 'translateX(-50%)' },
                '100%': { transform: 'translateX(0%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.85', transform: 'scale(0.98)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="antialiased selection:bg-[#DF9235]/25 selection:text-slate-900 text-slate-800 bg-[#F8FAFC]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
